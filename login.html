<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — HackDynamics</title>
<meta name="description" content="Sign in or create your HackDynamics account.">
<script src="js/theme.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<style>
  :root {
    --bg: #05080f; --bg-2: #0a101d; --line: #18243c;
    --text: #d7e2f2; --dim: #7e90b0;
    --cyan: #2de2ff; --blue: #4f7cff; --gold: #ffd166;
    --green: #3ddc97; --red: #ff5d73;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    --serif: Georgia, "Times New Roman", serif;
  }
  html[data-theme="light"] {
    --bg: #f3f5fa; --bg-2: #ffffff; --line: #d8dfea;
    --text: #35415c; --dim: #64718d;
    --cyan: #0e7ea3; --blue: #3b5bdb; --gold: #a16207; --green: #0e8a63; --red: #c92a44;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--sans); line-height: 1.6;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .glow {
    position: fixed; top: -240px; left: 50%; width: 820px; height: 560px;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(79,124,255,.16), transparent 70%);
    pointer-events: none; z-index: 0;
  }
  html[data-theme="light"] .glow { background: radial-gradient(closest-side, rgba(59,91,219,.1), transparent 70%); }
  header {
    position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: space-between;
    padding: 26px 24px; max-width: 1020px; margin: 0 auto; width: 100%;
  }
  .brand {
    font-family: var(--mono); font-weight: 700; font-size: 16px;
    letter-spacing: 2.5px; color: var(--text); text-decoration: none;
  }
  .brand b { color: var(--cyan); }
  .theme-toggle {
    background: none; border: 1px solid var(--line); color: var(--gold);
    font-size: 15px; width: 36px; height: 36px; border-radius: 999px; cursor: pointer;
    transition: border-color .2s;
  }
  .theme-toggle:hover { border-color: var(--gold); }
  main {
    position: relative; z-index: 1; flex: 1;
    display: flex; align-items: center; justify-content: center; padding: 30px 20px 70px;
  }
  .card {
    width: 100%; max-width: 420px;
    background: var(--bg-2); border: 1px solid var(--line);
    border-radius: 18px; padding: 34px 32px;
  }
  .kicker {
    font-family: var(--mono); font-size: 11.5px; letter-spacing: 3px;
    text-transform: uppercase; color: var(--gold); margin-bottom: 14px;
  }
  h1 { font-size: 27px; letter-spacing: -.5px; margin-bottom: 6px; color: var(--text); }
  h1 em { font-family: var(--serif); font-style: italic; color: var(--cyan); }
  .sub { color: var(--dim); font-size: 15px; margin-bottom: 26px; }
  label { display: block; font-size: 13px; color: var(--dim); margin: 14px 0 6px; }
  input {
    width: 100%; font-family: var(--sans); font-size: 15px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    transition: border-color .2s;
  }
  input:focus { outline: none; border-color: var(--cyan); }
  .btn {
    width: 100%; margin-top: 22px; padding: 13px;
    border: none; border-radius: 999px; cursor: pointer;
    font-family: var(--sans); font-weight: 600; font-size: 15.5px; color: #041018;
    background: linear-gradient(90deg, var(--cyan), var(--blue));
    transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(45,226,255,.25); }
  .btn:disabled { opacity: .6; cursor: default; transform: none; box-shadow: none; }
  .toggle { margin-top: 20px; text-align: center; font-size: 14px; color: var(--dim); }
  .toggle a { color: var(--cyan); text-decoration: none; cursor: pointer; font-weight: 600; }
  .msg { margin-top: 18px; padding: 11px 14px; border-radius: 10px; font-size: 13.5px; display: none; }
  .msg.show { display: block; }
  .msg.err { background: rgba(255,93,115,.1); border: 1px solid rgba(255,93,115,.4); color: var(--red); }
  .msg.ok { background: rgba(61,220,151,.1); border: 1px solid rgba(61,220,151,.4); color: var(--green); }
  .notice {
    margin-top: 18px; padding: 12px 14px; border-radius: 10px; font-size: 13px;
    background: rgba(255,209,102,.08); border: 1px solid rgba(255,209,102,.35); color: var(--dim);
  }
  .notice code { font-family: var(--mono); font-size: 12px; color: var(--gold); }
  footer { position: relative; z-index: 1; text-align: center; padding: 20px; font-size: 12.5px; color: var(--dim); }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<header>
  <a class="brand" href="index.html">HACK<b>DYNAMICS</b></a>
  <button class="theme-toggle" aria-label="Toggle color theme">☾</button>
</header>

<main>
  <div class="card">
    <div class="kicker" id="kicker">Members</div>
    <h1 id="title">Welcome <em>back</em></h1>
    <p class="sub" id="subtitle">Log in to continue to your course.</p>

    <form id="auth-form" novalidate>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" minlength="6" required>
      <button class="btn" id="submit" type="submit">Log in</button>
    </form>

    <div class="msg" id="msg"></div>

    <div class="toggle" id="toggle">
      New here? <a id="toggle-link">Create an account</a>
    </div>

    <div class="notice" id="notice" style="display:none">
      Sign-in isn't configured yet. Add your Supabase keys in
      <code>js/supabase-config.js</code> and run <code>SUPABASE_SETUP.md</code>.
    </div>
  </div>
</main>

<footer>Built with obsession, for people who ask how.</footer>

<script>
(function () {
  "use strict";
  var mode = "login"; // or "signup"
  var form = document.getElementById("auth-form");
  var submit = document.getElementById("submit");
  var msg = document.getElementById("msg");
  var pw = document.getElementById("password");

  function nextUrl() {
    var m = location.search.match(/[?&]next=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : (window.HD_CONFIG.COURSE_URL || "databases-in-depth.html");
  }
  function say(text, kind) {
    msg.textContent = text;
    msg.className = "msg show " + (kind || "err");
  }
  function clearMsg() { msg.className = "msg"; }

  // If already signed in, skip the form.
  if (window.HDAuth && HDAuth.isConfigured()) {
    HDAuth.getSession().then(function (s) { if (s) location.replace(nextUrl()); });
  } else {
    document.getElementById("notice").style.display = "block";
    submit.disabled = true;
    say("Add your Supabase keys to enable sign-in (see the note below).", "err");
  }

  function setMode(next) {
    mode = next;
    clearMsg();
    var isSignup = mode === "signup";
    document.getElementById("kicker").textContent = isSignup ? "Join" : "Members";
    document.getElementById("title").innerHTML = isSignup ? "Create your <em>account</em>" : "Welcome <em>back</em>";
    document.getElementById("subtitle").textContent = isSignup
      ? "One account unlocks the course once you're a premium member."
      : "Log in to continue to your course.";
    submit.textContent = isSignup ? "Create account" : "Log in";
    pw.setAttribute("autocomplete", isSignup ? "new-password" : "current-password");
    document.getElementById("toggle").innerHTML = isSignup
      ? 'Already have an account? <a id="toggle-link">Log in</a>'
      : 'New here? <a id="toggle-link">Create an account</a>';
    document.getElementById("toggle-link").addEventListener("click", function () {
      setMode(isSignup ? "login" : "signup");
    });
  }

  document.getElementById("toggle-link").addEventListener("click", function () { setMode("signup"); });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!window.HDAuth || !HDAuth.isConfigured()) return;
    var email = document.getElementById("email").value.trim();
    var password = pw.value;
    if (!email || password.length < 6) { say("Enter an email and a password of at least 6 characters."); return; }

    clearMsg();
    submit.disabled = true;
    var busyLabel = mode === "signup" ? "Creating…" : "Signing in…";
    var original = submit.textContent; submit.textContent = busyLabel;

    var op = mode === "signup"
      ? HDAuth.signUp(email, password)
      : HDAuth.signIn(email, password).then(function (s) { return { session: s }; });

    op.then(function (r) {
      if (mode === "signup" && r.needsEmailConfirm) {
        say("Account created! Check your email to confirm, then log in.", "ok");
        submit.disabled = false; submit.textContent = original;
        setMode("login");
        return;
      }
      say("Success — taking you to your course…", "ok");
      location.replace(nextUrl());
    }).catch(function (err) {
      say(err.message || "That didn't work. Please try again.");
      submit.disabled = false; submit.textContent = original;
    });
  });
})();
</script>
</body>
</html>
