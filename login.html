<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — HackDynamics</title>
<meta name="description" content="Sign in or create your HackDynamics account.">
<script>document.documentElement.classList.add("js");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/site.css">
<script src="js/theme.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<style>
  body { min-height: 100svh; display: flex; flex-direction: column; }
  main {
    flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px; padding: 70px 10px 10px;
  }
  .side {
    border-radius: 12px; padding: clamp(28px, 4vw, 56px);
    display: flex; flex-direction: column; justify-content: space-between; gap: 32px;
    min-height: min(78svh, 720px);
  }
  .side h1 { font-size: var(--s-display); max-width: 9ch; }
  .side .sub { font-size: var(--s-lead); line-height: 1.3; max-width: 26ch; }
  .formside {
    display: flex; align-items: center;
    padding: clamp(28px, 4vw, 56px);
  }
  .card { width: 100%; }
  .side figure img { width: 100%; max-width: 560px; border-radius: 12px; }
  .side figcaption { font-size: var(--s-small); margin-top: 10px; }
  label { display: block; font-size: var(--s-small); font-weight: 600; margin: 18px 0 8px; }
  input {
    width: 100%; font: 400 var(--s-body)/1.2 var(--sans);
    background: var(--bg-2); color: var(--text);
    border: 2px solid var(--bg-2); border-radius: 12px; padding: 14px 16px;
    transition: border-color .2s;
  }
  input::placeholder { color: var(--text-dim); }
  input:focus { outline: none; border-color: var(--text); }
  .card .btn { width: 100%; justify-content: center; margin-top: 26px; }
  .btn:disabled { opacity: .55; cursor: default; transform: none; }
  .toggle { margin-top: 20px; font-size: var(--s-small); }
  .toggle a { font-weight: 600; text-decoration: underline 2px; text-underline-offset: .25em; cursor: pointer; }
  .msg { margin-top: 18px; padding: 12px 14px; border-radius: 12px; font-size: var(--s-small); display: none; color: #1a1a1a; }
  .msg.show { display: block; }
  .msg.err { background: var(--field-db); }
  .msg.ok { background: var(--field-dsa); }
  .notice { margin-top: 18px; padding: 12px 14px; border-radius: 12px; font-size: var(--s-small); background: var(--bg-3); }
  .notice code { font-family: var(--mono); font-size: 13px; }
  @media (max-width: 860px) {
    main { grid-template-columns: minmax(0, 1fr); padding-top: 66px; }
    .side { min-height: 0; }
  }
</style>
<script defer data-website-id="dfid_X1DU2Hz5qz3tMjdZrFWUW" data-domain="hackdynamics.com" src="https://datafa.st/js/script.js"></script>
</head>
<body>

<nav class="bar" data-field="bone" aria-label="Site">
  <a class="wordmark" href="index.html">HackDynamics</a>
  <a href="courses.html">Courses</a>
  <a href="https://github.com/skystrix/hackdynamics">GitHub</a>
  <button class="theme-toggle" aria-label="Toggle color theme">Dark</button>
</nav>

<main>
  <section class="side" data-field="db">
    <div>
      <h1 id="title" data-rise>Welcome back</h1>
      <p class="sub" id="subtitle" data-rise style="--i:1">Log in to carry your progress between devices. You never need an account to read.</p>
    </div>
    <figure data-rise style="--i:2">
      <img src="assets/shots/step-map.webp" width="1760" height="1520" alt="The journey map of RAG in Depth with the progress bar at the top.">
      <figcaption>Each course's map remembers which chapters you have read.</figcaption>
    </figure>
  </section>

  <section class="formside">
    <div class="card">
      <form id="auth-form" novalidate data-rise style="--i:2">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters" minlength="6" required>
        <button class="btn" id="submit" type="submit">Log in</button>
      </form>

      <div class="toggle" id="forgot-row"><a id="forgot-link">Forgot your password?</a></div>

      <div class="msg" id="msg"></div>

      <div class="toggle" id="toggle">
        New here? <a id="toggle-link">Create an account</a>
      </div>

      <div class="notice" id="notice" style="display:none">
        Sign-in isn't configured yet. Add your Supabase keys in
        <code>js/supabase-config.js</code> and run <code>SUPABASE_SETUP.md</code>.
      </div>
    </div>
  </section>
</main>

<script>
requestAnimationFrame(function () {
  document.querySelectorAll("[data-rise]").forEach(function (el) { el.classList.add("in"); });
});
(function () {
  "use strict";
  var mode = "login"; // or "signup"
  var form = document.getElementById("auth-form");
  var submit = document.getElementById("submit");
  var msg = document.getElementById("msg");
  var pw = document.getElementById("password");
  var email = document.getElementById("email");
  var forgotRow = document.getElementById("forgot-row");

  // Reset and confirmation links both land here with tokens in the URL hash:
  //   #access_token=…&type=recovery   (password reset)
  //   #access_token=…&type=signup     (email confirmed)
  function hashToken(type) {
    var h = location.hash.replace(/^#/, "");
    if (!new RegExp("(?:^|&)type=" + type + "(?:&|$)").test(h)) return null;
    var m = h.match(/(?:^|&)access_token=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : null;
  }
  var recovering = hashToken("recovery");
  var justConfirmed = !!hashToken("signup");
  // ponytail: the signup hash carries a usable session, but we just ask for a
  // login. Consume it here if that extra step ever bothers anyone.
  if (justConfirmed && history.replaceState) {
    history.replaceState(null, "", location.pathname + location.search);
  }

  function nextUrl() {
    var m = location.search.match(/[?&]next=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : (window.HD_CONFIG.COURSE_URL || "databases-in-depth.html");
  }
  function say(text, kind) {
    msg.textContent = text;
    msg.className = "msg show " + (kind || "err");
  }
  function clearMsg() { msg.className = "msg"; }

  // If already signed in, skip the form — unless we're mid password reset.
  if (window.HDAuth && HDAuth.isConfigured()) {
    if (!recovering) HDAuth.getSession().then(function (s) { if (s) location.replace(nextUrl()); });
  } else {
    document.getElementById("notice").style.display = "block";
    submit.disabled = true;
    say("Add your Supabase keys to enable sign-in (see the note below).", "err");
  }

  function setMode(next) {
    mode = next;
    clearMsg();
    // Reset mode: set a new password using the recovery token, no email field.
    if (mode === "reset") {
      document.getElementById("title").textContent = "New password";
      document.getElementById("subtitle").textContent = "Enter a new password for your account.";
      email.style.display = "none";
      email.previousElementSibling.style.display = "none"; // its <label>
      pw.value = "";
      pw.setAttribute("autocomplete", "new-password");
      submit.textContent = "Set new password";
      forgotRow.style.display = "none";
      document.getElementById("toggle").style.display = "none";
      return;
    }
    var isSignup = mode === "signup";
    email.style.display = ""; email.previousElementSibling.style.display = "";
    document.getElementById("toggle").style.display = "";
    forgotRow.style.display = isSignup ? "none" : "";
    document.getElementById("title").textContent = isSignup ? "Create an account" : "Welcome back";
    document.getElementById("subtitle").textContent = isSignup
      ? "Free. It only saves your progress so you can pick up on another device."
      : "Log in to carry your progress between devices. You never need an account to read.";
    submit.textContent = isSignup ? "Create account" : "Log in";
    pw.setAttribute("autocomplete", isSignup ? "new-password" : "current-password");
    document.getElementById("toggle").innerHTML = isSignup
      ? 'Already have an account? <a id="toggle-link">Log in</a>'
      : 'New here? <a id="toggle-link">Create an account</a>';
    document.getElementById("toggle-link").addEventListener("click", function () {
      setMode(isSignup ? "login" : "signup");
    });
  }

  document.getElementById("toggle-link").addEventListener("click", function () { setMode("signup"); });

  // "Forgot your password?" — email a reset link back to this page.
  document.getElementById("forgot-link").addEventListener("click", function () {
    if (!window.HDAuth || !HDAuth.isConfigured()) return;
    var addr = email.value.trim();
    if (!addr) { say("Enter your email above, then click “Forgot your password?” again."); email.focus(); return; }
    say("Sending a reset link…", "ok");
    var here = location.origin + location.pathname;
    HDAuth.requestPasswordReset(addr, here).then(function () {
      say("If an account exists for " + addr + ", a reset link is on its way. Check your email.", "ok");
    }).catch(function (err) { say(err.message || "Couldn't send the reset link. Please try again."); });
  });

  // A dead link (expired, or already consumed by an email link-scanner) comes
  // back as #error=access_denied&error_description=… — say so, don't show a
  // blank login form as if nothing happened.
  var linkError = (location.hash.match(/(?:^|[#&])error_description=([^&]+)/) || [])[1];

  if (recovering) setMode("reset");
  else if (justConfirmed) say("Email confirmed. Log in to continue.", "ok");
  else if (linkError) say(decodeURIComponent(linkError.replace(/\+/g, " ")) +
    ". Enter your email below and request a fresh reset link.");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!window.HDAuth || !HDAuth.isConfigured()) return;
    var password = pw.value;

    // Password-reset submit: set the new password with the recovery token.
    if (mode === "reset") {
      if (password.length < 6) { say("Choose a password of at least 6 characters."); return; }
      clearMsg(); submit.disabled = true;
      var resetOrig = submit.textContent; submit.textContent = "Saving…";
      HDAuth.updatePassword(password, recovering).then(function () {
        if (history.replaceState) history.replaceState(null, "", location.pathname + location.search);
        recovering = null;
        submit.disabled = false;
        setMode("login"); // clears the message box, so say() must come after it
        say("Password updated. You can log in now.", "ok");
      }).catch(function (err) {
        say(err.message || "Couldn't update the password. Request a fresh reset link.");
        submit.disabled = false; submit.textContent = resetOrig;
      });
      return;
    }

    var addr = email.value.trim();
    if (!addr || password.length < 6) { say("Enter an email and a password of at least 6 characters."); return; }

    clearMsg();
    submit.disabled = true;
    var busyLabel = mode === "signup" ? "Creating…" : "Signing in…";
    var original = submit.textContent; submit.textContent = busyLabel;

    var op = mode === "signup"
      ? HDAuth.signUp(addr, password, location.origin + location.pathname)
      : HDAuth.signIn(addr, password).then(function (s) { return { session: s }; });

    op.then(function (r) {
      if (mode === "signup" && r.needsEmailConfirm) {
        submit.disabled = false; submit.textContent = original;
        setMode("login"); // clears the message box, so say() must come after it
        say("Account created. We sent a confirmation link to " + addr +
            " — click it, then log in here. (Check spam if it's not there in a minute.)", "ok");
        return;
      }
      say("Success — taking you to your course…", "ok");
      location.replace(nextUrl());
    }).catch(function (err) {
      say(err.message || "That didn't work. Please try again.");
      submit.disabled = false; submit.textContent = original;
    });
  });
})();
</script>
</body>
</html>
